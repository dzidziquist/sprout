<script type="text/x-dc" data-dc-script data-props='{"species":{"editor":"enum","options":["monstera","pothos","fig","calathea","snake","hoya","cutting","tomato","pepper","onion"],"default":"monstera"},"mood":{"editor":"enum","options":["happy","thirsty","sleepy"],"default":"happy"},"pot":{"editor":"color","options":["#FF6B5B","#FFD23F","#5AB8FF","#A78BFA","#FFB3C7"],"default":"#FF6B5B"},"size":{"editor":"int","min":24,"max":400,"default":120},"bg":{"editor":"color","default":"#FFFFFF"},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    var sp = this.props.species || 'monstera';
    var mood = this.props.mood || 'happy';
    var size = Number(this.props.size) || 120;
    var jar = sp === 'cutting';
    // face sits on the pot (y≈81) or on the jar (y≈80)
    var y = jar ? 79 : 81;
    return {
      px: size + 'px',
      bg: this.props.bg || '#FFFFFF',
      pot: this.props.pot || '#FF6B5B',
      isMonstera: sp === 'monstera', isPothos: sp === 'pothos', isFig: sp === 'fig',
      isCalathea: sp === 'calathea', isSnake: sp === 'snake', isHoya: sp === 'hoya', isCutting: jar,
      isTomato: sp === 'tomato', isPepper: sp === 'pepper', isOnion: sp === 'onion',
      isPotted: !jar, isJar: jar,
      isHappy: mood === 'happy', isThirsty: mood === 'thirsty', isSleepy: mood === 'sleepy',
      eyeY: y, cheekY: y + 4.5, mouthY: y + 5.5,
      smile: 'M46.5 ' + (y + 4.5) + ' Q50 ' + (y + 8.5) + ' 53.5 ' + (y + 4.5),
      wobble: 'M45.5 ' + (y + 7) + ' Q47.75 ' + (y + 5) + ' 50 ' + (y + 7) + ' Q52.25 ' + (y + 9) + ' 54.5 ' + (y + 7),
      brows: 'M41.5 ' + (y - 3.5) + ' L46 ' + (y - 5.5) + ' M58.5 ' + (y - 3.5) + ' L54 ' + (y - 5.5),
      sweat: 'M64 ' + (y - 10) + ' q-2.8 3.6 0 5.6 q2.8 -2 0 -5.6z',
      sleepEyes: 'M41.5 ' + y + ' q2.5 2.2 5 0 M53.5 ' + y + ' q2.5 2.2 5 0'
    };
  }
}
</script>
