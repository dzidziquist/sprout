name: Publish knowledge pack

# Builds the knowledge packs phones download (docs/knowledge.md, "Knowledge packs") and pushes them to the
# public repo dzidziquist/plantfam-knowledge, whose GitHub Pages serves them. Only the packs are public;
# this repo can stay private. Runs after the tests and evals pass, when a merge to main changes the
# knowledge; can also be run by hand from the Actions tab (to republish, or to roll back from an older
# commit's run).
#
# Needs the KB_DEPLOY_TOKEN secret: a fine-grained token that can only write the contents of
# dzidziquist/plantfam-knowledge. That repo serves Pages from its main branch.

on:
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'assets/symptoms/**'
      - 'knowledge/**'
      - 'src/engine/knowledgePack.ts'
      - 'scripts/build-kb-pack.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kb-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ts:check
      - run: npm test
      - name: Build the packs
        run: npx vite-node scripts/build-kb-pack.ts -- --out dist-kb
      - uses: actions/checkout@v4
        with:
          repository: dzidziquist/plantfam-knowledge
          token: ${{ secrets.KB_DEPLOY_TOKEN }}
          path: site
      - name: Push to plantfam-knowledge
        run: |
          rsync -a --delete --exclude .git dist-kb/ site/
          cd site
          git config user.name "PlantFam knowledge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Knowledge pack from ${GITHUB_SHA::7}"
          git push
