name: TestFlight

# Builds the iOS app on EAS and sends it to TestFlight. Run it from the Actions tab.
# Needs one interactive first build from a Mac (see docs/launch-setup.md) so EAS holds the Apple
# signing credentials and an App Store Connect API key, plus an EXPO_TOKEN repository secret.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ts:check
      - run: npm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
