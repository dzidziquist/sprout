name: Copy signing secrets to Brewdies (temporary, delete after use)
on: workflow_dispatch
permissions: {}
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Write secrets into dzidziquist/Tea
        env:
          GH_TOKEN: ${{ secrets.TEA_PAT }}
          K_P8: ${{ secrets.ASC_KEY_P8 }}
          K_ID: ${{ secrets.ASC_KEY_ID }}
          K_ISS: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          EXPO: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          for pair in ASC_KEY_P8:K_P8 ASC_KEY_ID:K_ID ASC_ISSUER_ID:K_ISS APPLE_TEAM_ID:TEAM EXPO_TOKEN:EXPO; do
            name="${pair%%:*}"; var="${pair##*:}"
            if [ -z "${!var}" ]; then echo "MISSING in sprout: $name"; exit 1; fi
            printf '%s' "${!var}" | gh secret set "$name" --repo dzidziquist/Tea
            echo "copied $name"
          done
